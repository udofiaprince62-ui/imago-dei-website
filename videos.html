<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Imago Dei Prophetic Outreach</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile-nav.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="content-store.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
<header>
    <div class="container nav-container">
        <a href="index.html" class="logo">Imago Dei <span>Prophetic Outreach</span></a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="videos.html">Videos</a>
            <a href="blogs.html" class="active">Messages</a>
            <a href="gallery.html">Images</a>
            <a href="admin.html">Publish</a>
            <a href="about.html">About Us</a>
        </nav>
    </div>
</header>

<section class="hero page-hero">
    <div class="container">
        <h1>Faith &amp; Encouragement</h1>
        <p>Read messages, prayer guides, and updates from Imago Dei.</p>
    </div>
</section>

<main class="content-section">
    <div class="container post-list" id="message-list"></div>
</main>

<footer>
    <div class="container">
        <p>&copy; Imago Dei Prophetic Outreach. All rights reserved.</p>
        <p class="footer-sub">Reflecting the glory of God to the world</p>
    </div>
</footer>

<script>
function renderMessages(items) {
    const list = document.getElementById('message-list');
    if (!list) return;
    list.innerHTML = '';

    const normalized = (items || []).filter(item => (window.ContentStore ? window.ContentStore.normalise(item).type : item.type) === 'message');
    if (!normalized.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent = 'No messages have been published yet.';
        list.appendChild(empty);
        return;
    }

    normalized.forEach(item => {
        const article = document.createElement('article');
        article.className = 'card blog-post';
        const body = document.createElement('div');
        body.className = 'card-body';

        const date = document.createElement('span');
        date.className = 'post-date';
        date.textContent = item.date || 'Recently published';

        const title = document.createElement('h2');
        title.textContent = item.title || 'Untitled message';

        const text = document.createElement('p');
        text.textContent = item.body || '';

        body.append(date, title, text);
        article.appendChild(body);
        list.appendChild(article);
    });
}

if (window.ContentStore) {
    window.ContentStore.subscribe('message', renderMessages);
} else {
    try {
        const localItems = JSON.parse(localStorage.getItem('imago-dei-content') || '[]');
        renderMessages(localItems);
    } catch (error) {
        renderMessages([]);
    }
}
</script>
</body>
</html>
