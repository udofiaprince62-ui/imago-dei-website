<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Messages - Imago Dei Prophetic Outreach</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile-nav.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="content-store.js"></script><script src="nav.js" defer></script></head>
<body><header><div class="container nav-container"><a href="index.html" class="logo">Imago Dei <span>Prophetic Outreach</span></a><nav><a href="index.html">Home</a><a href="videos.html">Videos</a><a href="blogs.html" class="active">Messages</a><a href="gallery.html">Images</a><a href="admin.html">Publish</a><a href="about.html">About Us</a></nav></div></header><section class="hero page-hero"><div class="container"><h1>Faith &amp; Encouragement</h1><p>Read messages, prayer guides, and updates from Imago Dei.</p></div></section><main class="content-section"><div class="container post-list" id="message-list"></div></main><footer><div class="container"><p>&copy; Imago Dei Prophetic Outreach. All rights reserved.</p><p class="footer-sub">Reflecting the glory of God to the world</p></div></footer>
<script>
function render(items){const list=document.getElementById('message-list');list.innerHTML='';if(!items.length){list.innerHTML='<p class="empty-state">No messages have been published yet.</p>';return;}items.forEach(item=>{const article=document.createElement('article');article.className='card blog-post';const body=document.createElement('div');body.className='card-body';body.innerHTML=`<span class="post-date"></span><h2></h2><p></p><button class="delete-post" type="button">Delete post</button>`;body.querySelector('.post-date').textContent=item.date;body.querySelector('h2').textContent=item.title||'Untitled message';body.querySelector('p').textContent=item.body||'';body.querySelector('button').onclick=async()=>{if(await ContentStore.remove(item)) ContentStore.subscribe('message',render)};article.appendChild(body);list.appendChild(article);});}
ContentStore.subscribe('message',render);
</script></body></html>
