<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Messages - Imago Dei Prophetic Outreach</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="content-store.js"></script></head>
<body><header><div class="container nav-container"><a href="index.html" class="logo">Imago Dei <span>Prophetic Outreach</span></a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="videos.html">Videos</a><a href="blogs.html" class="active">Messages</a><a href="gallery.html">Images</a><a href="admin.html">Publish</a><a href="about.html">About Us</a></nav></div></header>
<section class="hero page-hero"><div class="container"><h1>Faith &amp; Encouragement</h1><p>Read messages, prayer guides, and updates from Imago Dei.</p></div></section>
<main class="content-section"><div class="container"><div class="section-title"><button id="recent-posts" type="button">Recent posts</button></div><div class="post-list" id="message-list"><p class="empty-state">No messages have been published yet.</p></div></div></main>
<div class="host-menu" id="host-menu"><button id="host-toggle" type="button" aria-expanded="false">Host menu</button><div id="host-panel" hidden><p>Host controls</p><button id="host-login" type="button">Sign in to edit</button><span id="host-status"></span></div></div>
<footer><div class="container"><p>&copy; Imago Dei Prophetic Outreach. All rights reserved.</p><p class="footer-sub">Reflecting the glory of God to the world</p></div></footer>
<script>
const list=document.getElementById('message-list'), menu=document.getElementById('host-menu'); let current=[];
document.getElementById('recent-posts').onclick=()=>list.scrollIntoView({behavior:'smooth'});
document.getElementById('host-toggle').onclick=()=>{const panel=document.getElementById('host-panel');panel.hidden=!panel.hidden;document.getElementById('host-toggle').setAttribute('aria-expanded',String(!panel.hidden));};
document.getElementById('host-login').onclick=async()=>{try{await ContentStore.hostLogin();document.getElementById('host-status').textContent='Host mode enabled.';render();}catch(e){document.getElementById('host-status').textContent=e.message;}};
function render(){list.innerHTML='';if(!current.length){list.innerHTML='<p class="empty-state">No messages have been published yet.</p>';return;}current.forEach(item=>{const article=document.createElement('article');article.className='card blog-post';const body=document.createElement('div');body.className='card-body';const date=document.createElement('span');date.className='post-date';date.textContent=item.date||'Recently published';const title=document.createElement('h2');title.textContent=item.title||'Untitled message';const text=document.createElement('p');text.textContent=item.body||'';body.append(date,title,text);if(ContentStore.isHost()){const tools=document.createElement('div');tools.className='post-tools';const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=async()=>{const titleValue=prompt('Message title',item.title||'');const bodyValue=prompt('Message text',item.body||'');if(titleValue!==null&&bodyValue!==null){await ContentStore.save({...item,title:titleValue,body:bodyValue});}};const del=document.createElement('button');del.className='danger-button';del.textContent='Delete';del.onclick=()=>ContentStore.remove(item);tools.append(edit,del);body.append(tools);}article.append(body);list.append(article);});}
ContentStore.subscribe('message',items=>{current=items;render();});
</script></body></html>
