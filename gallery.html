<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images - Imago Dei Prophetic Outreach</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="container nav-container"><a href="index.html" class="logo">Imago Dei <span>Prophetic Outreach</span></a><nav><a href="index.html">Home</a><a href="videos.html">Videos</a><a href="blogs.html">Blogs</a><a href="gallery.html" class="active">Images</a><a href="about.html">About Us</a></nav></div></header>
<section class="hero page-hero"><div class="container"><h1>Ministry Images</h1><p>Photos and images shared by the ministry.</p></div></section>
<main class="content-section"><div class="container"><div id="gallery" class="image-grid"></div><p id="empty" class="empty-state">No images have been added yet. The host can add images from the host dashboard.</p></div></main>
<footer><div class="container"><p>&copy; Imago Dei Prophetic Outreach. All rights reserved.</p><p class="footer-sub">Reflecting the glory of God to the world</p></div></footer>
<script>
const images = JSON.parse(localStorage.getItem('imago-dei-images') || '[]'); const gallery = document.getElementById('gallery'); document.getElementById('empty').hidden = images.length > 0;
images.forEach(image => { const article = document.createElement('article'); article.className = 'card image-card'; article.innerHTML = '<img alt=""><div class="card-body"><h3></h3><span class="post-date"></span></div>'; article.querySelector('img').src = image.src; article.querySelector('img').alt = image.title; article.querySelector('h3').textContent = image.title; article.querySelector('.post-date').textContent = image.date; gallery.appendChild(article); });
</script>
</body></html>
