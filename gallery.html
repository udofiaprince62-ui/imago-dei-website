<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Images - Imago Dei Prophetic Outreach</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile-nav.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="content-store.js"></script><script src="nav.js" defer></script></head>
<body><header><div class="container nav-container"><a href="index.html" class="logo">Imago Dei <span>Prophetic Outreach</span></a><nav><a href="index.html">Home</a><a href="videos.html">Videos</a><a href="blogs.html">Messages</a><a href="gallery.html" class="active">Images</a><a href="admin.html">Publish</a><a href="about.html">About Us</a></nav></div></header><section class="hero page-hero"><div class="container"><h1>Ministry Images</h1><p>Photos and images shared by the ministry.</p></div></section><main class="content-section"><div class="container"><div id="gallery" class="image-grid"></div><p id="empty" class="empty-state">No images have been published yet.</p></div></main><footer><div class="container"><p>&copy; Imago Dei Prophetic Outreach. All rights reserved.</p><p class="footer-sub">Reflecting the glory of God to the world</p></div></footer>
<script>
function render(items){const gallery=document.getElementById('gallery'),empty=document.getElementById('empty');gallery.innerHTML='';empty.hidden=items.length>0;items.forEach(item=>{const article=document.createElement('article');article.className='card image-card';const image=document.createElement('img');image.src=item.url||item.src||'';image.alt=item.title||'Ministry image';const body=document.createElement('div');body.className='card-body';const title=document.createElement('h3');title.textContent=item.title||'Untitled image';const date=document.createElement('span');date.className='post-date';date.textContent=item.date;const button=document.createElement('button');button.className='delete-post';button.textContent='Delete post';button.onclick=async()=>{if(await ContentStore.remove(item)) ContentStore.subscribe('image',render)};body.append(title,date,button);article.append(image,body);gallery.appendChild(article);});} ContentStore.subscribe('image',render);
</script></body></html>
